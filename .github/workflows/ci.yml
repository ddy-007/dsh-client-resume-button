name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: projection tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # lib/projection.js has no imports, so the suite runs without installing
      # anything: no registry access, no lockfile, no build step. Bare
      # `node --test` auto-discovers tests/; a quoted glob would be passed
      # through unexpanded and silently match nothing.
      - name: Projection contract tests
        run: node --test

      # Human-readable record of one fold per interruption state, so a reviewer
      # can see the behaviour rather than read an assertion.
      - name: Interruption state record
        run: node scripts/record-states.mjs

      - name: Manifest sanity
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fail = (m) => { console.error("FAIL: " + m); process.exit(1); };

            if (pkg.dsh?.bundle?.patch !== "./cordis.patch.yml") fail("dsh.bundle.patch missing or wrong");
            if (!fs.existsSync(pkg.dsh.bundle.patch)) fail("bundle patch file does not exist");
            if (pkg.dsh?.client?.platform !== "web") fail("dsh.client.platform must be web");
            if (!Array.isArray(pkg.dsh?.client?.inject) || pkg.dsh.client.inject.length === 0) fail("dsh.client.inject must be a non-empty array");
            if (typeof pkg.dsh?.engines?.dsh !== "string") fail("dsh.engines.dsh must be declared");
            if (typeof pkg.peerDependencies?.["@deepseek-ai/dsh"] !== "string") fail("@deepseek-ai/dsh peer must be declared");
            if (pkg.peerDependencies["@deepseek-ai/dsh"] !== pkg.dsh.engines.dsh) fail("engines.dsh and the @deepseek-ai/dsh peer must state the same range");

            // Two separate traps, both invisible to a plain "does it look okay" read:
            //
            // 1. A single segment like ">=0.2.0-rc.2 <0.3.0" silently drops every
            //    prerelease on a tuple it has no prerelease comparator for.
            //    node-semver only admits a prerelease when some comparator shares
            //    its full major.minor.patch AND carries a prerelease tag, so
            //    0.2.1-rc.2 is excluded and `npm install` fails with ERESOLVE.
            //    DSH's gate evaluates with includePrerelease: true, which hides it.
            // 2. "*" on an @deepseek-ai peer resolves to that package's npm "latest"
            //    tag, which lags far behind ("next" is the harness-matched line).
            //    npm then builds an old 0.0.x graph that includes packages never
            //    published to npm, and the install fails outright.
            //
            // These are structural checks on the declared strings; the `install`
            // job below proves the same thing the expensive way, by resolving
            // them with npm for real.
            const range = pkg.dsh.engines.dsh;

            for (const [name, dep] of Object.entries(pkg.peerDependencies ?? {})) {
              if (!name.startsWith("@deepseek-ai/")) continue;
              if (dep.trim() === "*") fail(name + " peer must not be '*' (npm resolves it to the stale latest tag)");
            }
            for (const [name, dep] of Object.entries(pkg.peerDependencies ?? {})) {
              if (name === "@deepseek-ai/dsh" || !name.startsWith("@deepseek-ai/dsh-")) continue;
              if (dep !== range) fail(name + " peer must use the same range as engines.dsh");
            }

            // <0.3.0-0 is the sentinel that keeps 0.3.0 prereleases out as well;
            // a bare <0.3.0 would let 0.3.0-rc.1 through.
            if (!/<0\.3\.0-0/.test(range)) fail("engines.dsh upper bound must use the <0.3.0-0 sentinel");

            if (pkg.private === true) fail("package must not be private");
            if (!pkg.name || !pkg.version) fail("name and version are required");

            // The entry id the bundle patch inserts must be the package name, so
            // the store can match an installed row by package identity.
            const patch = fs.readFileSync(pkg.dsh.bundle.patch, "utf8");
            if (!patch.includes("id: " + pkg.name)) fail("bundle patch must insert an entry id equal to the package name");
            if (!patch.includes("name: " + pkg.name)) fail("bundle patch must mount the package by its own name");

            console.log("manifest OK: " + pkg.name + "@" + pkg.version + " engines=" + pkg.dsh.engines.dsh);
          '

  isolated:
    name: isolated interruption states
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Mounts the real Cordis context, the real projection registry and the real
      # plugin service, then appends real turn/start + turn/end events to a real
      # Session and reads the projection snapshot the client renders from. The
      # SDK packages are the only reason this job installs anything.
      - name: Install SDK peers
        run: pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Run each interruption state under an isolated DSH_HOME
        env:
          DSH_VERIFY_DEBUG: "1"
        run: |
          node -e '
            const { createRequire } = require("node:module");
            const { pathToFileURL } = require("node:url");
            const { join } = require("node:path");
            const { existsSync } = require("node:fs");
            console.log("cwd = " + process.cwd());
            console.log("package.json here = " + existsSync(join(process.cwd(), "package.json")));
            console.log("node_modules here = " + existsSync(join(process.cwd(), "node_modules")));
            const r = createRequire(pathToFileURL(join(process.cwd(), "package.json")));
            for (const p of ["@deepseek-ai/dsh-session-projection", "@deepseek-ai/cordis", "zod"]) {
              try { console.log(p + " -> " + r.resolve(p)); }
              catch (e) { console.log(p + " -> FAIL " + e.code); }
            }
          '
          node scripts/verify-isolated.mjs

  install:
    name: npm install against the real harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The manifest tests prove the range is right by parsing it. This job proves
      # it by asking npm to actually resolve it, which is the only way to catch a
      # peer graph that looks fine and still fails. It installs the published
      # harness at the two versions this plugin claims to support, then installs
      # the packed tarball into that project. A wildcard peer, or a range missing
      # its prerelease branch, makes npm exit non-zero here.
      - name: Install the packed plugin against each supported harness
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          TARBALL="$(ls "$RUNNER_TEMP"/*.tgz | head -n 1)"
          echo "tarball: $TARBALL"
          for VERSION in 0.2.0-rc.2 0.2.1-rc.2; do
            DIR="$RUNNER_TEMP/against-$VERSION"
            mkdir -p "$DIR"
            printf '{"name":"probe","version":"1.0.0","private":true}\n' > "$DIR/package.json"
            echo "=== harness $VERSION ==="
            (cd "$DIR" && npm install "@deepseek-ai/dsh@$VERSION" --no-audit --no-fund --loglevel=error)
            (cd "$DIR" && npm install "$TARBALL" --no-audit --no-fund --loglevel=error)
            node -e '
              const fs = require("node:fs");
              const dir = process.argv[1];
              const manifest = JSON.parse(fs.readFileSync(dir + "/node_modules/client-resume-button/package.json", "utf8"));
              if (manifest.version === undefined) { console.error("FAIL: plugin not installed"); process.exit(1); }
              if (manifest.dsh?.bundle?.patch !== "./cordis.patch.yml") { console.error("FAIL: dsh.bundle lost on install"); process.exit(1); }
              const patch = fs.readFileSync(dir + "/node_modules/client-resume-button/cordis.patch.yml", "utf8");
              if (!patch.includes("client-resume-button")) { console.error("FAIL: bundle patch is wrong"); process.exit(1); }
              console.log("    installed " + manifest.name + "@" + manifest.version + " with bundle intact");
            ' "$DIR"
          done

  pack:
    name: npm pack contents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert the tarball ships what the plugin needs
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const fs = require("node:fs");
            const doc = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"));
            // npm 12 keys the report by package name instead of returning an array.
            const entry = Object.values(doc)[0];
            const files = entry.files.map((f) => f.path);
            const need = [
              "package.json",
              "cordis.patch.yml",
              "lib/index.js",
              "lib/client.js",
              "lib/projection.js",
              "lib/resume.js",
              "README.md",
              "LICENSE"
            ];
            const missing = need.filter((f) => !files.includes(f));
            if (missing.length > 0) {
              console.error("FAIL: tarball is missing " + missing.join(", "));
              process.exit(1);
            }
            console.log("pack OK: " + files.length + " files, " + entry.size + " bytes packed");
          '
